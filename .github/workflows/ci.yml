name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Build & Test (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start db and backend containers
        run: docker compose up -d --build db backend

      - name: Install dependencies
        run: docker compose exec -T backend npm ci

      - name: Generate Prisma client
        run: docker compose exec -T backend npx prisma generate

      - name: Check formatting
        run: docker compose exec -T backend npm run format:check

      - name: Run lint
        run: docker compose exec -T backend npm run lint

      - name: Apply migrations to test database
        run: docker compose exec -T -e DB_DATABASE=todo_app_test backend npm run migrate:deploy

      - name: Run unit tests
        run: docker compose exec -T backend npm run test

      - name: Run e2e tests
        run: docker compose exec -T backend npm run test:e2e

      - name: Build
        if: always()
        run: docker compose exec -T backend npm run build

      - name: Stop services
        if: always()
        run: docker compose down -v

  frontend:
    name: Build & Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run lint
        run: npm run lint --if-present
        working-directory: frontend

      - name: Run tests
        run: npm run test --if-present
        working-directory: frontend

      - name: Build
        if: always()
        run: npm run build --if-present
        working-directory: frontend
