openapi: 3.1.0
info:
  title: Todo API
  version: 1.0.0
paths:
  /todos:
    get:
      operationId: listTodos
      responses:
        '200':
          description: Todo一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '201':
          description: 作成されたTodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          title:
                            type: array
                            items:
                              type: string
                          description:
                            type: array
                            items:
                              type: string
                          dueDate:
                            type: array
                            items:
                              type: string
        default:
          $ref: '#/components/responses/UnexpectedError'
  /todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      operationId: getTodo
      tags: [todos]
      summary: 指定したIDのTodoを取得する
      responses:
        '200':
          description: 指定したTodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: IDの形式が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定したIDのTodoが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedError'
    put:
      operationId: updateTodo
      tags: [todos]
      summary: 指定したIDのTodoを更新する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '200':
          description: 更新後のTodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: バリデーションエラー、またはIDの形式が不正
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - allOf:
                      - $ref: '#/components/schemas/ValidationErrorResponse'
                      - type: object
                        properties:
                          message:
                            type: object
                            properties:
                              title:
                                type: array
                                items:
                                  type: string
                              description:
                                type: array
                                items:
                                  type: string
                              dueDate:
                                type: array
                                items:
                                  type: string
        '404':
          description: 指定したIDのTodoが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedError'
    delete:
      operationId: deleteTodo
      tags: [todos]
      summary: 指定したIDのTodoを削除する
      responses:
        '200':
          description: 削除成功（レスポンスボディなし）
        '400':
          description: IDの形式が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定したIDのTodoが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
        default:
          $ref: '#/components/responses/UnexpectedError'
components:
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    UnexpectedError:
      description: 予期しないエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Todo:
      type: object
      required: [id, title, description, dueDate]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 191
        description:
          type: string
          minLength: 1
          maxLength: 191
        dueDate:
          type: ['string', 'null']
          format: date
    TodoInput:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 191
        description:
          type: string
          minLength: 1
          maxLength: 191
        dueDate:
          type: ['string', 'null']
          format: date
    ErrorResponse:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
    ValidationErrorResponse:
      type: object
      required: [statusCode, message, error]
      properties:
        type:
          type: string
          enum: [validation_error]
        statusCode:
          type: integer
        error:
          type: string
    NotFoundErrorResponse:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
