openapi: 3.1.0
info:
  title: Todo API
  version: 1.0.0
paths:
  /todos:
    get:
      operationId: listTodos
      responses:
        '200':
          description: Todo一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '201':
          description: 作成されたTodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - type: object
                    required: [message]
                    properties:
                      message:
                        type: object
                        properties:
                          title:
                            $ref: '#/components/schemas/ValidationMessageNode'
                          description:
                            $ref: '#/components/schemas/ValidationMessageNode'
                          dueDate:
                            $ref: '#/components/schemas/ValidationMessageNode'
  /todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      operationId: getTodo
      tags: [todos]
      summary: 指定したIDのTodoを取得する
      responses:
        '200':
          description: 指定したTodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: IDの形式が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: 指定したIDのTodoが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
    put:
      operationId: updateTodo
      tags: [todos]
      summary: 指定したIDのTodoを更新する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoInput'
      responses:
        '200':
          description: 更新後のTodo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: バリデーションエラー、またはIDの形式が不正
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BadRequestResponse'
                  - allOf:
                      - $ref: '#/components/schemas/ValidationErrorResponse'
                      - type: object
                        required: [message]
                        properties:
                          message:
                            type: object
                            properties:
                              title:
                                $ref: '#/components/schemas/ValidationMessageNode'
                              description:
                                $ref: '#/components/schemas/ValidationMessageNode'
                              dueDate:
                                $ref: '#/components/schemas/ValidationMessageNode'
        '404':
          description: 指定したIDのTodoが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
    delete:
      operationId: deleteTodo
      tags: [todos]
      summary: 指定したIDのTodoを削除する
      responses:
        '200':
          description: 削除成功（レスポンスボディなし）
        '400':
          description: IDの形式が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '404':
          description: 指定したIDのTodoが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundErrorResponse'
components:
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Todo:
      type: object
      required: [id, title, description, dueDate]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 191
        description:
          type: string
          minLength: 1
          maxLength: 191
        dueDate:
          type: ['string', 'null']
          format: date
    TodoInput:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 191
        description:
          type: string
          minLength: 1
          maxLength: 191
        dueDate:
          type: ['string', 'null']
          format: date
    ValidationErrorResponse:
      type: object
      required: [type, statusCode, message, error]
      properties:
        type:
          type: string
          enum: [validation_error]
        statusCode:
          type: integer
          enum: [400]
        error:
          type: string
    ValidationMessageNode:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: string
    NotFoundErrorResponse:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
          enum: [404]
        message:
          type: string
        error:
          type: string
    BadRequestResponse:
      type: object
      required: [statusCode, message, error]
      properties:
        statusCode:
          type: integer
          enum: [400]
        message:
          type: string
        error:
          type: string
